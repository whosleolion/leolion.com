 you are starting to improve on this.", "Another reversed moon meaning is that the forces of the night that are bringing you confusion are starting to dissipate. You have started managing your fears and anxiety. Whatever negative energies you have been facing are slowly fading away. It presents a liberating experience as you discover the positive side of things."]}, {"name": "The Star", "slug": "the-star-meaning-major-arcana-tarot-card-meanings", "kwu": "hope, inspiration, positivity, faith, renewal, healing, rejuvenation", "kwr": "hopelessness, despair, negativity, lack of faith, despondent", "up": ["The Star brings hope, renewed power, and strength to carry on with life. It shows how abundantly blessed you are by the universe as evidenced by the various things around you. It may not be directly evident at the moment, for this card follows the trauma of the Tower card. Remember that you hold within you all that you need for your fulfillment - the only thing that you need is courage. For this, you have all reasons to rejoice. To see this card is a message to have faith, for the universe will bless you and bring forth all that you need.", "To receive the Star in your reading means that you have gone and passed through a terrible life challenge. You have managed to go through this without losing your hope. While you suffered, you perhaps were not aware of your own strength, but you are now perhaps recognizing that the loss helped you discover your own resilience and inner power. It is only now that you can really appreciate all that you have."], "rev": ["When the Star card is reversed, it means that you are feeling as though everything has turned against you. The challenges that you would normally see as exciting seem instead to make you feel as though you cannot overcome them. You have lost faith in something, whether inside yourself or with something you normally find dear.", "Without hope, without faith, we cannot find the motivation to progress forward in the challenges that we face. Where in your life are you feeling hopeless? In what ways do you already feel defeated? And how does that affect your actions? The star reversed asks us to nurture our sense of hope and positive energy to help propel our actions with joy instead of fear."]}, {"name": "The Sun", "slug": "the-sun-meaning-major-arcana-tarot-card-meanings", "kwu": "happiness, success, optimism, vitality, joy, confidence, happiness, truth", "kwr": "blocked happiness, excessive enthusiasm, pessimism, unrealistic expectations, conceitedness", "up": ["The Sun card represents success, abundance, and radiance. Like the sun itself, it gives strength and vitality to all those that are lucky enough to feel its rays. There is much joy and happiness that is coming to you.", "Because of your own personal fulfillment, you provide others with inspiration and joy as well. People are drawn to you because they are capable of seeing the warm and beautiful energy which you bring into their lives. You are also in a position in which you are capable of sharing your qualities as well as achievements with other people. You radiate love and affection towards those you care about the most.", "The card shows that you have a significant sense of deserved confidence right now. Life is currently particularly good, and the sun is shining your way as you reach the goals that you set. The Sun is one of the cards in the tarot which provide nothing but good feelings and fulfillment."], "rev": ["In the reversed position, the Sun indicates that you might have significant difficulties finding positive aspects to certain situations. The clouds might be blocking out the warmth and light that you need to progress. This might be preventing you from feeling confident and powerful. You may experience certain setbacks which are damaging your optimism and enthusiasm.", "On the other hand, the Sun reversed might be indicative that you are being unrealistic. It might be a sign that you have an overly optimistic perception of certain situations. These are things that you need to take into account in order to ensure that you are on the right track and your successes continue as they do."]}, {"name": "The Tower", "slug": "the-tower-meaning-major-arcana-tarot-card-meanings", "kwu": "disaster, destruction, upheaval, trauma, sudden change, chaos", "kwr": "averting disaster, delaying the inevitable, resisting change", "up": ["The Tower represents change in the most radical and momentous sense. It is for this reason that the card itself visually looks so unnerving. But it doesn't necessarily have to be truly frightening or ominous. Because at the heart of this card, its message is foundational, groundbreaking change.", "The kind of event that the Tower card marks does not have to be something terrible, like a disaster or a great loss.  Change itself is a normal part of life that one has to embrace. But it can sometimes strike fear, for it means that we must abandon the truths that we have known prior to this event. The old ways are no longer useful, and you must find another set of beliefs, values and processes to take their place.", "Be positive, it is time for you to replace the old foundations of the past with something that is more genuine and will serve you better in what is to come.", "In terms of work, there is an inevitable argument bound to happen. You need to be in control and keep your temper in check. Avoid saying something that may hurt other people. When it comes to your love life, your romantic relationship may be nearing its end. Take this as a warning - if you really value your relationship, then it is time for you to take damage control or open a communication to clear misunderstandings. In your finances, the tower meaning refers to the need to be assured on your transactions."], "rev": ["When you get the Tower card reversed, you can feel some crisis looming along the horizon, and you are struggling as much as you can to try and avoid its manifestation. What you have not realized is that these breakdowns can be beneficial in breaking down your reliance on something that is false. The tower is built on faulty foundations, and it must fall. Though the destruction will be painful, the humbleness resulting from it can bring us peace.", "What you relied on will no longer be there for you. Do not take this as a drastic and depressing change, it is time for you to become more self-reliant."]}, {"name": "The Wheel of Fortune", "slug": "the-wheel-of-fortune-meaning-major-arcana-tarot-card-meanings", "kwu": "change, cycles, fate, decisive moments, luck, fortune, unexpected events", "kwr": "bad luck, lack of control, clinging to control, unwelcome changes, delays", "up": ["The Wheel of Fortune turns evermore, seemingly to communicate that life is made up of both good and bad times, and that the cycle is one that we cannot control. It is something that is subjected to both kings and workers, and that nobody on earth can avoid what is fated. When you have good moments in your life, make sure that you enjoy to the fullest, for what comes up must always go down. The same is true in reverse - when you are in a bad situation, things will eventually become better again.", "Greater forces that are outside of human control are at work here. The same forces that govern the changing of the seasons, or the rising and setting of the sun is also the master of luck and the fate of individuals. Where it lands is as random as chance - you may find yourself at either the top or bottom, but remember that no matter what the outcome it may not last for very long, for the wheel always turns."], "rev": ["When the wheel is reversed, it means that luck has not been on your side and misfortunes have been following you. When it's associated with this card, you must understand that these are due to external influences that you cannot control. Like the wheel, our luck and our fate is always in motion, and sometimes we are on the bottom. Be assured that the wheel will turn again, and you will be okay again soon.", "What you shouldn't do however, is cling to the illusion of control. Perhaps in this turn of the wheel, the lesson is to learn to let go and release. There are things that cannot be moved by human will and action alone. When we do not let go, it can bring only more suffering, for you may blame yourself for actions that could not have altered the situation. When we learn to accept, we also learn to forgive ourselves. We learn to move on, and move forward - and eventually, we learn that this feeling of acceptance can push the wheel again forward, and move it towards a new cycle."]}, {"name": "The World", "slug": "the-world-meaning-major-arcana-tarot-card-meanings", "kwu": "completion, achievement, fulfilment, sense of belonging, wholeness, harmony", "kwr": "lack of closure, lack of achievement, feeling incomplete, emptiness", "up": ["To encounter the World in your cards is to encounter a great unity and wholeness. It symbolizes the moment when the inner and the outer worlds - self and other - become a single entity. In some traditions, this state is described as enlightenment, or nirvana. There is a recognition that the individual self is profoundly linked with all other things, and that we all dance and sway along the flow of life to one rhythm. Not only do you hear this rhythm, but you participate in it - following the dips and the rises, the joys and the sorrows.", "The meaning of the World card is fulfillment, achievement, and completion. This shows that all the efforts that you have been putting in place are starting to pay off. It reflects that you have completed a major milestone in your life and you have built the resilience to withstand challenges. The World may indicate completion of a long-term project, study or any other major event in your life. It may also mean the birth of a child, marriage, graduation or any other thing that you have accomplished.", "The World card shows that you have a desire to give back to the community in various ways. You have a commitment to make the world a better place because you understand that everything is connected."], "rev": ["You are drawing near to something that marks the end of a journey or an era. You may have many accomplishments that have lined your path, but there is a strange emptiness that fills you when you look backwards upon it, as if you have all the pieces but they are not coming together. What is missing? Do you feel connected to what you're doing? Do you feel connected to others? What alienates you from feeling complete? From feeling whole?"]}, {"name": "Three of Cups", "slug": "three-of-cups-meaning-tarot-card-meanings", "kwu": "friendship, community, gatherings, celebrations, group events, social events", "kwr": "gossip, scandal, excess, isolation, loneliness, solitude, imbalanced social life", "up": ["The meaning behind the Three of Cups represents a period of happiness. You will be able to forget the worries of your daily life and spend quality time with family and friends.", "To see the Three of Cups can indicate a happy reunion with a long lost friend, relative, or loved one. It can also mean a celebration, whether it is your own or for someone who you love. The event can be a birthday, wedding, or any other happy occasion. In general, it is about spending quality time with people you cherish in your life.", "The Three of Cups is about spending quality time with people you cherish in your life.", "The three maidens represent your circle of friends who you turn to for love, compassion, and support when you need them the most. It can be old college buddies, colleagues at work, or people you have shared a special bond over the years.", "If you've had problems with your social life, this card can signal the end of those hardships. You will be able to resolve differences and learn how to deal with the problem."], "rev": ["When the Three of Cups is reversed, it means that you may have no time to socialize or go out with friends. You may be too busy with school or work that you can’t spare some time to have fun. The Three of Cups reversed can also mean losing touch with some of your friends. As time passes, you may find that you are growing apart from one another. When we grow older, we must put in effort to make sure that our friendships are not neglected.", "Alternatively, the Three of Cups reversed can mean that there is a lack of balance and harmony within your social circle. Gossip and scandal can rear their ugly heads. Perhaps there is envy hidden within this circle, and as a result, you are feeling isolated."]}, {"name": "Three of Pentacles", "slug": "three-of-pentacles-meaning-tarot-card-meanings", "kwu": "teamwork, shared goals, collaboration, apprenticeship, effort, pooling energy", "kwr": "lack of cohesion, lack of teamwork, apathy, poor motivation, conflict, ego, competition", "up": ["The threes in the tarot represent the successful completion of a goal - it takes the sources of energy in the ace and the twos and adds a foundational factor, and usually involves a group of some sort. In this scenario, the upright three of pentacles meaning is that there is a successful achievement of all the requirements to pursue your business, deal, venture or any other kind of endeavor. Successful projects usually require different kinds of expertise, and at this moment, the Three of Pentacles means that all the skills required are coming together. In short, you are enjoying enjoying working together as part of a team, and also in the initial success of this bigger project.", "The three pentacles reveals a successful beginning towards achieving your goals, it is a sign of encouragement that you should press on with the same effort without giving up. You may struggle to accomplish your goals as an individual, but the Three of Pentacles also teaches people not ignore the talents of the others that surround you. You need the collaboration of others, with diverse viewpoints, experiences and expertise to accomplish something more than you could have ever dreamed of."], "rev": ["The Three of Pentacles reversal meaning indicates that there is lack of team work; it shows that people are working against each other and undermining the project along the way. There seems to be too much competition between them - each person is trying to display superiority. This result to scarcity of resources - too many people are viewing their project partners as competitors.", "When you are in such a team, it is good to ensure that you try as much as possible to inspire camaraderie. With this constant bickering, it is hard for the projects in the reversed Three of Pentacles to come into completion. You may find that people are not listening to others, and everyone is working for themselves. This difference in motives and ambitions yields complications. If you can be the first to reach out and give everyone a chance to be heard and considered, perhaps this project has a chance to move forward."]}, {"name": "Three of Swords", "slug": "three-of-swords-meaning-tarot-card-meanings", "kwu": "heartbreak, separation, sadness, grief, sorrow, upset, loss, trauma, tears", "kwr": "healing, forgiveness, recovery, reconciliation, repressing emotions", "up": ["The Three of Swords depicts the message of rejection, betrayal, hurt and discouragement. In moments like these, we are well served by the mind. If you can think logically about it and prepare for the experience, the impact of this pain may be minimized.", "But remember too, that pain and grief are a normal part of life, because they make us appreciate what joy and happiness we have, as well as teaching us. It is through pain that we learn to be avoid mistakes that could lead us into danger and grief. It is therefore a necessity in the journey of life. The Three of Swords therefore is a depiction of suffering that is meant to make us stronger, more careful and more vigilant.", "Sometimes life gives us no choice - we are knocked down. But what determines one's future is the choice of whether to remain knocked down, or rise again. Each little piece of suffering you encounter serves as a stepping stone to find a deeper meaning in this world. This card comes at a time when you need to prepare yourself for this next stage in life. While the grief may be extremely hurtful, it enables you to forget your past and focus on your future knowing that you have control of what actions you take afterwards. Don’t dwell so much on what is troubling you but instead, focus on what is approaching, because you determine your fate."], "rev": ["The Three of Swords reversed indicates that have faced a recent loss, a break-up or a moment of grief. You may be still recovering from this, and your emotions have not completely calmed, making it difficult to move on. Although you may still be thinking of your past suffering, this card may be a signal that it's time to let go and look forwards towards life ahead of you, because there is much for you to enjoy.", "Many don’t see this, and they end up being immersed in their own pain for too long, delaying their own recovery process. Don’t focus too much on what happened, renew your emotions and gather your courage. The reversed Three of Swords card is here to let you know that all difficult moments pass - they are not there to stay, and when we fall, we can also rise again."]}, {"name": "Three of Wands", "slug": "three-of-wands-meaning-tarot-card-meanings", "kwu": "momentum, confidence, expansion, growth, foresight, looking ahead", "kwr": "restriction, limitations, lack of progress, obstacles, delays, frustration", "up": ["The meaning of the Three of Wands hints that you are planning or going to plan for the future with more conviction. This could mean that everything around your plans is going smoothly, as you have taken the time to plan your future, and are taking steps to turn plans into action. It hints that you are perhaps creating a stable foundation for yourself.", "The symbolism within the Three of Wands is that opportunities that can take place to widen your horizons in many areas. It also is a warning to keep your mind open as better opportunities could open up to you. As you take steps towards achieving what you set out to do, you are also becoming more aware of opportunities that are coming your way, and this could be take you out of your comfort zone. This pushes you to sometimes embrace change, and to start thinking in the long-term.", "The Three of Wands hints that you are creating a stable foundation for yourself.", "The Three of Wands can show that you are in control and have a strong position, just like the character that overlooks and stands strong. The Three of Wands is one of the main cards of foresight and vision.", "The last Three of Wands meaning is that of travel in search of what you are seeking. There is a sense of leaving home, a voyage that must be undertaken. Great things do not happen to those that simply wait for them, you must expand. For most readings, this shows that you may travel to a new land over the water and that you may find an opportunity during your travels."], "rev": ["The reversed Three of Wands indicates that you may have been embarking on personal journeys or developments, but you have not received the achievements that you were hoping for. This could be due to delays or road blocks. Despite all this, the card reminds you that all of your work has not been for nothing, but rather that it has helped you with your personal strength and fortitude.", "The Three of Wands reversed can also mean you need to take some time to plan your future. This is especially true if you have not started on your long term goals or have become overwhelmed by the tasks that you face now, or will have to face soon. You are only reacting and not acting with thought and deliberation.", "However, the most common Three of Wands reversed meaning is a nudge to include planning for future changes, and to watch for better options in case that they show up. The figure on the Three of Wands knows this and always keeps his eyes open for how the future could change, and it is a worthy lesson to learn."]}, {"name": "Two of Cups", "slug": "two-of-cups-meaning-tarot-card-meanings", "kwu": "unity, partnership, attraction, connection, close bonds, joining forces, mutual respect", "kwr": "separation, rejection, division, imbalance, tension, bad communication, withdrawal", "up": ["To see the Two of Cups is an indication of a partnership that is built on the union of forces, a strong connection and a balanced and equal partnership. The exchange of cups suggest that each party's emotions are intertwined with the other's, and each participant's feelings have profound affects on the other. A strong pair is indicated here, the joy of two becoming one.", "When it comes to work, you may notice that the people around you will start to appreciate you more. There is a mutual respect here, meaning you will also be more comfortable in your workplace. If you are looking for new job opportunities, this card may be a good sign. In terms of love, the card represents commitment, a balanced relationship, and love. But this does not simply mean that you will no longer need to nurture your love to make it last. The card only signifies that true love and affection is present.", "In your finances, the Two of Cups is associated with fairness and balance. This means that you are currently financially capable and you have the right amount of money to deal with your obligations. In relation with your health, people who are currently facing some health issues need to look for a practitioner that they will be comfortable working with and whom they can trust. In spirituality, it is a call for you to be more endearing and loving towards the others. You are receiving positive energy from the universe, and you need to share that energy."], "rev": ["When reversed, the Two of Cups can mean that the balance that was once there is broken. This balance was an integral part of keeping the individuals together, but to break it is to create disconnection and discord. The negative energy of two forces is present, and instead of them joining or attracting, they seem to repel each other.", "You may be finding that certain small details that were not problems before are coming into play, signaling that one party may have resentments. A line of communication that allowed you and the other party to openly talk about disagreements has been cut off, only worsening the cycle of resentment and imbalance.", "Be the first to open up, and you may find the problem much easier to repair than you thought it would be."]}, {"name": "Two of Pentacles", "slug": "two-of-pentacles-meaning-tarot-card-meanings", "kwu": "balancing resources, adaptation, resourcefulness, flexibility, stretching resources", "kwr": "imbalance, unorganized, overwhelmed, messiness, chaos, overextending", "up": ["The Two of Pentacles is a card about balance - the coins are displayed in a manner that is precarious, any small change in wind or weight can tip and send them falling. For those that may have more coins to go around, they can afford to be less careful, but at this moment things may be tight. Wealth too, is a kind of energy, and it is the kind whose goings in and goings out are easiest and most tangible to see.", "There is a possibility that you are trying hard to keep the two aspects of your life in a perfect and delicate balance. This could be your career, money, love and health. The balancing act depicted in the card suggests that there are two major factors that you are deeply concerned about. It is time for you to step back to have a better perspective of the situation. While you may initially think it will save you time, multi-tasking may just worsen the situation. Cut down on your tasks and concentrate on these two factors that are troubling you.", "You've done a good job keeping things stable, for you seem to be able to adapt well to all the changes that ask you to continually re-balance.", "When it comes to love, the Two of Pentacles is associated with your inability to provide the energy and time required to make your partner happy. Your partnership should be your main priority, but with all the madness in other areas of your life, you are finding it hard to devote your attention to your loved ones. With regards to finances, you should pay heed on the bottom line. You should have a clear picture on your financial state. Plan your finances accordingly, control your expenditures and increase your stream of income to create a solid foundation for your future. In terms of health, this card is asking you to find a balance between your own well-being and your responsibilities. It's easy to make yourself the last priority when you have so many things happening around you."], "rev": ["When the Two of Pentacles is in reversed position, it can mean that you are trying to juggle much too many things in your life. You need to take at least a short break to eliminate the stress. In case you are feeling that you can’t handle everything, you need to consider your own well-being and provide yourself with a time to breathe. In your work, the Two of Pentacles reversal can be a positive omen. Avoid committing to a lot of things since it will overwhelm you.", "In your finances, you need to learn how to live in your capacity. The Two of Pentacles reversal meaning reminds you to be aware of your income and expenditures since overspending can become a large issue, especially when you are being pulled in many directions."]}, {"name": "Two of Swords", "slug": "two-of-swords-meaning-tarot-card-meanings", "kwu": "stalemate, difficult choices, stuck in the middle, denial, hidden information", "kwr": "indecision, hesitancy, anxiety, too much information, no right choice, truth revealed", "up": ["When we see the Two of Swords in a reading, we are encountering a stalemate. Two equal and opposing forces are joined in battle, and there seems to be no end in sight. This wasn't what you had in mind when you chanced to walk down this path, and you find yourself caught in the middle. Without something, or someone to intervene, this may continue indefinitely. We find ourselves in a situation where we must make a choice, we can side with one part of the situation, or we can side with the other. Neither seems particularly appealing, which makes the decision even more difficult. But unless we move past this stalemate, there can be no more progress.", "The Two of Swords is often related with balance and partnership. It signifies the need to keep your relationships balanced. Regardless if it is in business, friendship or romantic relationship, you may find yourself struggling to maintain the current state of affairs, and may find yourself caught in the middle.  In regards to your work, you may be currently stuck in limbo and are perhaps waiting on another party's decision. Remain patient and avoid pressuring people in making their decision abruptly.", "The Two of Swords meaning may depict a warning to have caution. Like the woman in the card, you may be choosing to keep the blindfold on, hoping the problem will just go away. You should avoid evading any issues that you are facing, since it will not solve your problems."], "rev": ["The situation we see in the reversed Two of Swords is a stalemate of a legendary kind, one where two forces are battling each other. This battle can be representative of both something internal or external, and you are forced to be in between and be the decision maker. However, because neither party seems particularly pleasing to work with, you may find yourself confused, the pressure is too much, and you are unable to make a decision.", "When you do make the decision, it will be choosing between two bad outcomes. Do not worry, the more important thing here is to make a choice, from then on, we can deal with whatever consequences come."]}, {"name": "Two of Wands", "slug": "two-of-wands-meaning-tarot-card-meanings", "kwu": "planning, first steps, making decisions, leaving comfort, taking risks", "kwr": "bad planning, overanalyzing, not taking action, playing it safe, avoiding risk", "up": ["The Two of Wands is a more mature version of the ace of wands, meaning that that this tarot card is all about planning and moving forward – progression. Look at it this way; you have already set out to achieve a particular task, which means you have turned an idea into a realistic plan. Such a plan will require fulfillment and therefore you have to progress from just having the plan to actually achieving what you set out for.", "Discovery is being considered as another two of wands meaning. This is because it means that you are stepping out of your cocoon and exploring new experiences and worlds. While the beginning might seem tough and difficult, the Two of Wands card encourages you to strive on and push forward.", "The Two of Wands card also means that you are beginning to realize your objectives and long-term goals before you set out to achieve these objectives. In other words, you have strived to get to where you are and now, moving forward, you have your long-term goals in mind.", "In summary, the Two of Wands meaning revolves around making decisions. In other words, you are either satisfied with your current knowledge, or you are moving forward and taking risks. It means, leaving our comfort zones and exploring new territory."], "rev": ["The Two of Wands reversed meaning suggests the need to set up long-term goals. Begin the process of setting up your goals by identifying what to you is important. Proceed by planning how you intend on achieving such goals.", "Another Two of Wands reversal meaning suggests that you have ignored important fine points associated with planning your future. Lack of proper planning could be the reason for your downfall.", "Other interpretations can include either overconfidence or lack of patience, both are possible in bringing you disarray in your path forward."]}];
const SUITS=[["Wands","🔥"],["Cups","💧"],["Swords","🌬️"],["Pentacles","🪙"]];
const MAJOR=["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Strength","The Hermit","The Wheel of Fortune","Justice","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
const RANKS=["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"];
const ROMAN=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
const byName={};CARDS.forEach(c=>byName[c.name]=c);
const $=id=>document.getElementById(id), main=$("main");
let state={};                      // {group, card, dir}
let stack=[];                      // previous states
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{})k=="onclick"?e.onclick=attrs[k]:e.setAttribute(k,attrs[k]);kids.flat().forEach(x=>e.append(x));return e}
function go(next){stack.push(state);state=next;render();window.scrollTo(0,0)}
function render(){
  main.innerHTML="";
  $("back").hidden=!stack.length;
  const {group,card,dir}=state;
  $("crumbs").textContent=[group,card&&card.name,dir].filter(Boolean).join("  ›  ");
  if(!group){
    main.append(el("h2",0,"Which arcana?"));
    const g=el("div",{class:"grid"},
      el("button",{class:"wide",onclick:()=>go({group:"Major Arcana"})},el("span",{class:"sym"},"★"),"Major Arcana"));
    SUITS.forEach(([s,i])=>g.append(el("button",{onclick:()=>go({group:s})},el("span",{class:"sym"},i),s)));
    main.append(g);
  }else if(!card){
    main.append(el("h2",0,group=="Major Arcana"?"Which card?":"Which value?"));
    const g=el("div",{class:group=="Major Arcana"?"grid":"grid three"});
    if(group=="Major Arcana")MAJOR.forEach((n,i)=>g.append(el("button",{onclick:()=>go({group,card:byName[n]})},el("span",{class:"sym"},ROMAN[i]),n)));
    else RANKS.forEach((r,i)=>g.append(el("button",{onclick:()=>go({group,card:byName[r+" of "+group]})},i<10?(i+1)+" · "+r:r)));
    main.append(g);
  }else if(!dir){
    main.append(el("h2",0,card.name));
    main.append(el("div",{class:"dir"},
      el("button",{onclick:()=>go({group,card,dir:"Upright"})},"▲ Upright"),
      el("button",{onclick:()=>go({group,card,dir:"Reversed"})},"▼ Reversed")));
  }else{
    const up=dir=="Upright", txt=up?card.up:card.rev;
    main.append(el("h2",0,card.name),el("span",{class:"tag"},dir),
      el("p",{class:"kw"},up?card.kwu:card.kwr),
      el("div",{class:"meaning"},txt.map(p=>el("p",0,p))),
      el("div",{class:"links"},
        el("a",{href:BASE+card.slug,target:"_blank",rel:"noopener"},"Full entry on Labyrinthos ↗"),
        el("button",{onclick:()=>{stack.push(state);state={group,card};render()}},"Other direction for "+card.name),
        el("button",{onclick:()=>{stack=[];state={};render()}},"Look up another card")));
  }
}
$("back").onclick=()=>{state=stack.pop()||{};render();window.scrollTo(0,0)};
$("home").onclick=()=>{stack=[];state={};render()};
render();
</script>
</body>
</html>
