<!doctype html>
<!-- INTERMACHINAS character lookdev: serve the repo root (python3 -m http.server) and open
     /tools/intermachinas/lookdev.html?chars=player,guard&pose=run&yaw=0.6
     params: chars (comma list of looks; "ghost" = the last-known-position ghost),
             pose (idle|run|sprint|climb|stance|block|broken|dead|hurt|air|vault|attack:KIND:u),
             yaw (radians, or comma list per char), gap (m between chars), flash (hex, e.g. cc0000),
             cam (x,y,z,tx,ty,tz), speed (m/s the root moves, for sash/cape swing), w,h -->
<html><head><meta charset="utf-8"><title>INTERMACHINAS lookdev</title>
<style>html,body{margin:0;background:#dde2e8;overflow:hidden}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from '../../src/building/intermachinas/js/vendor/three.module.min.js';
import { Rig, Poses } from '../../src/building/intermachinas/js/rig.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1200), H = +(q.get('h') || 700);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdde2e8); scene.fog = new THREE.Fog(0xdde2e8, 45, 150);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f96a3, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4); sun.position.set(-12, 30, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0xb9bec6, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
if (q.get('wall')) { const w = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 1), new THREE.MeshStandardMaterial({ color: 0xc8ccd2 })); w.position.set(0, 2.5, 0.85); w.receiveShadow = true; scene.add(w); }

const chars = (q.get('chars') || 'player').split(',');
const yaws = (q.get('yaw') || '0').split(',').map(Number);
const gap = +(q.get('gap') || 1.1);
const pnames = (q.get('pose') || 'idle').split(',');
const flash = q.get('flash');
const speed = +(q.get('speed') || 0);
function poseFor(t, pname) {
  const [n, a, b] = pname.split(':');
  switch (n) {
    case 'run': return Poses.run(t * 9, 0.5);
    case 'sprint': return Poses.run(t * 12, 1);
    case 'crouch': return Poses.run(t * 6, 0.2, 1);
    case 'climb': return Poses.climb(+(a || 0.8), false);
    case 'hang': return Poses.climb(0, true);
    case 'attack': return Poses.attack(a, +(b || 0.6));
    case 'stance': case 'block': case 'dead': case 'hurt': case 'hide': case 'slide': case 'sync': return Poses[n]();
    case 'broken': return Poses.broken(t);
    case 'air': return Poses.air(+(a || 2));
    case 'vault': return Poses.vault(0.5);
    case 'look': return Poses.look(+(a || 0.6));
    default: return Poses.idle(t);
  }
}
const rigs = [];
let tris = {};
chars.forEach((c, i) => {
  const isGhost = c === 'ghost';
  const opts = isGhost ? { ghost: 0xffffff } : { look: c, club: c === 'guard' || c === 'bodyguard' || c === 'target', scale: c === 'bodyguard' ? 1.08 : 1 };
  const r = new Rig(opts);
  r.root.position.set((i - (chars.length - 1) / 2) * gap, 0, 0);
  r.root.rotation.y = yaws[i] ?? yaws[0];
  if (isGhost) r.ghostMat.opacity = 0.28;
  scene.add(r.root); rigs.push(r); tris[c] = r.tris;
});
// settle poses (+ let the sash/cape swing if the rig "moves")
const dt = 1 / 30;
for (let s = 0; s < 45; s++) {
  for (const r of rigs) {
    const fw = r.root.rotation.y;
    r.root.position.x += Math.sin(fw) * speed * dt; r.root.position.z += Math.cos(fw) * speed * dt;
    const pname = pnames[rigs.indexOf(r)] ?? pnames[0];
    const p = poseFor(s * dt + 1, pname);
    if (pname === 'blade') p.blade = 1;
    r.apply(p, dt, 30);
  }
}
if (speed) rigs.forEach((r, i) => { r.root.position.set((i - (chars.length - 1) / 2) * gap, 0, 0); });
if (q.get('blade')) rigs.forEach((r) => { r.cur.blade = 1; r.write(); });
if (flash) rigs.forEach((r) => r.flash(parseInt(flash, 16), true));
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 35), W / H, 0.05, 300);
const cp = (q.get('cam') || `0,1.3,${2.4 + chars.length * 0.9},0,1.0,0`).split(',').map(Number);
cam.position.set(cp[0], cp[1], cp[2]); cam.lookAt(cp[3], cp[4], cp[5]);
setTimeout(() => { renderer.render(scene, cam); setTimeout(() => { renderer.render(scene, cam); console.log('LOG tris ' + JSON.stringify(tris) + ' calls ' + renderer.info.render.calls + ' tri ' + renderer.info.render.triangles); document.title = 'done'; }, 300); }, 1500);
</script></body></html>
