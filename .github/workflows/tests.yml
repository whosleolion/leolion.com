name: Tests

# Duat: the save service (against stand-ins for Google's services) and the site in Chromium.
on:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Save service
        run: node tests/save-service.test.js
      - name: Site
        run: node tests/site.test.js
