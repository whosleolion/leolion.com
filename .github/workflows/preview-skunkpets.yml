name: Skunkpets Redux preview

# Publishes the Skunkpets Redux build from any branch except master to
# leolion.com/building/skunkpets-redux-preview/ (noindexed, unlinked), so
# changes can be tried in a real browser without touching the live game.
# Only this game's folder is uploaded (into the preview folder, skipping files
# that haven't changed), plus the article editor (tools/skunkpets-redux/editor,
# which the preview page loads and the live game never does). The live deploy
# (deploy-neocities.yml) still runs only on master. The preview loads its song and voice clips from its own
# folder (siteAsset in the game's script), the art from tinypetgames, and
# keeps its own save slot (see SAVE / CONTINUE).
on:
  push:
    branches-ignore: ["master"]
    paths:
      - "tools/skunkpets-redux/**"
      - "src/building/skunkpets-redux/**"
      - ".github/workflows/preview-skunkpets.yml"
  workflow_dispatch: {}

concurrency:
  group: skunkpets-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node tools/skunkpets-redux/build.js

      - name: Make the preview copy
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA::7}"
          rm -rf /tmp/preview && mkdir -p /tmp/preview
          cp -r src/building/skunkpets-redux/. /tmp/preview/
          # The article editor (preview only): its files, and a tag that loads
          # it and tells it which branch to save to.
          mkdir -p /tmp/preview/editor
          cp tools/skunkpets-redux/editor/editor.js tools/skunkpets-redux/editor/editor.css /tmp/preview/editor/
          editor="<link rel=\"stylesheet\" href=\"/building/skunkpets-redux-preview/editor/editor.css?v=${sha}\"><script src=\"/building/skunkpets-redux-preview/editor/editor.js?v=${sha}\" data-repo=\"${GITHUB_REPOSITORY}\" data-branch=\"${branch}\"></script>"
          # Title and a corner badge say which build this is.
          sed -e "s#<title>[^<]*</title>#<title>PREVIEW: Skunkpets Redux (${sha})</title>#" \
              -e "s#</body>#<div style=\"position:fixed;left:8px;bottom:8px;z-index:2147483647;padding:3px 7px;background:\#ff0;color:\#000;font:bold 11px monospace;pointer-events:none;opacity:.85\">PREVIEW ${sha}</div>${editor}</body>#" \
              src/building/skunkpets-redux/index.html > /tmp/preview/index.html
          grep -q "PREVIEW ${sha}</div>" /tmp/preview/index.html
          grep -q "editor/editor.js?v=${sha}" /tmp/preview/index.html

      - name: Upload to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY_LEOLIONCOM }}
        run: |
          set -euo pipefail
          dest=building/skunkpets-redux-preview
          auth=(-H "Authorization: Bearer ${NEOCITIES_API_KEY}")
          # What's already there, so unchanged files (like the 8MB song)
          # aren't re-sent on every push.
          curl -sS "${auth[@]}" "https://neocities.org/api/list?path=${dest}" > /tmp/list.json
          upload() {  # $1 = destination path, $2 = local file
            status=$(curl -sS -o /tmp/response.json -w "%{http_code}" "${auth[@]}" \
              -F "$1=@$2" https://neocities.org/api/upload)
            echo "$1: $status $(cat /tmp/response.json)"
            [ "$status" -eq 200 ]
          }
          # Everything but the page first (song, Diskette's voice, the editor),
          # into the preview's own folder; the page loads them from there.
          cd /tmp/preview
          find . -type f ! -path ./index.html | sed 's#^\./##' | while read -r f; do
            have=$(jq -r --arg p "${dest}/${f}" '.files[]? | select(.path == $p) | .sha1_hash' /tmp/list.json)
            if [ "$have" = "$(sha1sum "$f" | cut -d' ' -f1)" ]; then
              echo "${dest}/${f}: unchanged"
            else
              upload "${dest}/${f}" "$f"
            fi
          done
          upload "${dest}/index.html" index.html
          echo "Preview: https://leolion.com/${dest}/" >> "$GITHUB_STEP_SUMMARY"
