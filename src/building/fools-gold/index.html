<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="fg-build" content="4f5e4f82">
<meta name="description" content="A price estimator for game masters. Works offline, no accounts, no tracking.">
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Fool's Gold</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fool's Gold">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css?v=4f5e4f82">
</head>
<body>
<!--FG-BODY-START-->
<div class="app" id="app">
  <header class="top">
    <h1>Fool's <span class="struck">G</span>old</h1>
    <div class="topr">
      <button class="cartpill" id="cartPill" data-act="cart-open" aria-haspopup="dialog" aria-label="Open the cart" hidden></button>
      <button class="gear" id="gear" data-act="open-world" aria-haspopup="dialog" aria-label="Settings">&#9881;&#xFE0E;</button>
    </div>
  </header>
  <main class="main" id="main">
    <div id="understanding"></div>
    <div id="result" aria-live="polite"></div>
    <div id="history" class="history"></div>
  </main>
  <div class="dock">
    <div id="tray"></div>
    <div class="input">
      <div class="fieldwrap"><div class="mirror" id="mirror" aria-hidden="true"></div><textarea id="q" rows="1" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="Describe what to price" aria-label="Describe what you want priced"></textarea></div>
      <button class="mic" id="micBtn" data-act="mic" aria-label="Dictate" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="clear" id="clearBtn" data-act="clear" aria-label="Clear" hidden>&times;</button>
      <button class="go" data-act="go" aria-label="Done">&uarr;</button>
    </div>
  </div>
</div>

<div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Settings">
  <div class="drawer-panel" id="drawerPanel"></div>
</div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-act="sheet-close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
    <button class="grab" data-act="sheet-close" aria-label="Close"></button>
    <div class="sheet-head"><h2 id="sheetTitle">Breakdown</h2><div class="sheet-acts" id="sheetActs"></div><button class="sheet-x" data-act="sheet-close" aria-label="Close">&times;</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="sr" class="sr-only" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!--FG-BODY-END-->
<script type="module" src="js/app.js?v=4f5e4f82"></script>
</body>
</html>
