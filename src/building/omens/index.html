<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b10">
<title>Omens</title>
<style>
:root{--bg:#0d0b10;--fg:#f1ead8;--dim:#8f879c;--red:#d8423a;--acc:#e8b84a;--paper:#f4ecd8;--ink:#1a1420}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
h1{margin:0;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stage{perspective:900px;width:min(78vw,320px);aspect-ratio:5/7}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.9,.3,1)}
.card.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 40px #000a}
.back{background:repeating-linear-gradient(45deg,#2a1118 0 10px,#1c0b10 10px 20px);border:6px solid var(--paper);display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--red)}
.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:14px 18px}
.front.red{color:#b3221b}
.corner{font-size:32px;font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center;width:max-content}
.corner.flip{align-self:flex-end;transform:rotate(180deg)}
.omen{text-align:center;font-size:clamp(19px,5.4vw,24px);font-weight:600;line-height:1.25;padding:0 4px}
.omen.joker{color:#b3221b}
button{font:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--acc);border:0;border-radius:12px;padding:16px 34px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.left{color:var(--dim);font-size:13px;letter-spacing:.08em;min-height:18px}
</style>
</head>
<body>
<h1>Trouble Feature Omens</h1>
<div class="stage"><div class="card" id="card">
  <div class="face back">☠</div>
  <div class="face front" id="front"></div>
</div></div>
<button id="draw">Pull an omen</button>
<div class="left" id="left"></div>
<script>
// Source: "TROUBLE FEATURE OMEN SHEET" (Google Sheets). Edit here to change the deck.
const DECK=[
["♥️","1","Small but ominous injury"],["♥️","2","Moment of true connection"],["♥️","3","Flashback to past..."],["♥️","4","Too alone..."],["♥️","5","Someone else saves you"],["♥️","6","Past wounds healing"],["♥️","7","A sharp pain"],["♥️","8","That was too close"],["♥️","9","A trail of blood?"],["♥️","10","Blood... blood everywhere"],["♥️","J","Limb trapped"],["♥️","Q","Get a bloody transformation"],["♥️","K","Suffer a lasting injury"],
["♦️","1","A taste of what you want most"],["♦️","2","False hope"],["♦️","3","A lucky break"],["♦️","4","A silver lining"],["♦️","5","Just half of what you need"],["♦️","6","Forced into a dangerous place alone"],["♦️","7","A door shuts, a window opens"],["♦️","8","A band-aid solution"],["♦️","9","Something gone missing"],["♦️","10","Gain a useful item"],["♦️","J","Someone has what you want"],["♦️","Q","Make a horrible compromise"],["♦️","K","Everything you ever wanted... sort of"],
["♣️","1","Vision obscured"],["♣️","2","It was just an animal."],["♣️","3","Weather gets bad"],["♣️","4","Something in the background you don't see"],["♣️","5","Interpersonal conflict escalates"],["♣️","6","Feeling of being followed"],["♣️","7","Fashion a clever escape"],["♣️","8","Black goo everywhere"],["♣️","9","Something awful you don't see"],["♣️","10","A horrid, horrid sight"],["♣️","J","Reminder of horrid past"],["♣️","Q","Your dark side comes out"],["♣️","K","Recognize the monster in yourself"],
["♠️","1","A terrible dream or vision"],["♠️","2","Bystander in danger"],["♠️","3","Choose which bystander to save"],["♠️","4","Here comes the big one"],["♠️","5","You're a step ahead for once"],["♠️","6","Learn monster's weakness"],["♠️","7","A risky opportunity. Pull again if you want."],["♠️","8","Your body isn't yours"],["♠️","9","Something you can't unsee"],["♠️","10","You seriously harm the monster"],["♠️","J","A bystander is killed"],["♠️","Q","A bystander is worse than killed"],["♠️","K","You kill someone"],
["🃏","JR","Monster comes out full-force. Pull again."],["🃏","JB","Monster comes out full-force. Pull again."]
];
const $=id=>document.getElementById(id);
let pile=[],showing=false;
function shuffle(){pile=DECK.map((_,i)=>i);for(let i=pile.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pile[i],pile[j]]=[pile[j],pile[i]]}}
function render(c){
  const [suit,rank,text]=c, joker=suit==="🃏", red=suit==="♥️"||suit==="♦️"||joker;
  const r=rank==="1"?"A":joker?"★":rank;
  const f=$("front");f.className="face front"+(red?" red":"");
  f.innerHTML=`<div class="corner"><span>${r}</span><span>${joker?"🃏":suit}</span></div><div class="omen${joker?" joker":""}"></div><div class="corner flip"><span>${r}</span><span>${joker?"🃏":suit}</span></div>`;
  f.querySelector(".omen").textContent=text;
}
function draw(){
  if(!pile.length)shuffle();
  const c=DECK[pile.pop()],card=$("card");
  const go=()=>{render(c);card.classList.add("up");showing=true;
    $("left").textContent=pile.length?pile.length+" left in the deck":"last card — next pull reshuffles"};
  if(showing){card.classList.remove("up");setTimeout(go,330)}else go();
}
shuffle();
$("draw").onclick=draw;
$("card").onclick=draw;
</script>
</body>
</html>
