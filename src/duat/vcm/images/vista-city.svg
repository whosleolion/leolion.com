<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="blocks" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#2c313c"/>
      <rect x="6" y="6" width="58" height="58" rx="3" fill="#1f232b"/>
      <rect x="12" y="12" width="20" height="18" fill="#252a33"/>
      <rect x="38" y="36" width="20" height="22" fill="#252a33"/>
    </pattern>
    <pattern id="blocks2" width="50" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="50" height="90" fill="#2c313c"/>
      <rect x="5" y="5" width="40" height="80" rx="3" fill="#1d2129"/>
    </pattern>
    <pattern id="waves" width="40" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q10 3 20 8 T40 8" fill="none" stroke="#1d3550" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#122033"/>
  <rect width="1600" height="1000" fill="url(#waves)" opacity="0.8"/>
  <!-- land -->
  <path d="M330 0 C300 140 360 230 300 330 C250 420 330 520 280 620 C240 700 300 820 250 1000 L1600 1000 L1600 0 Z" fill="url(#blocks)"/>
  <!-- old town, skewed grid -->
  <path d="M1130 60 L1560 40 L1580 420 L1180 470 Z" fill="url(#blocks2)" stroke="#3a4050" stroke-width="3"/>
  <!-- river -->
  <path d="M1600 560 C1400 600 1250 520 1080 600 C920 680 760 610 600 700 C470 770 380 720 270 760" fill="none" stroke="#122033" stroke-width="46"/>
  <path d="M1600 560 C1400 600 1250 520 1080 600 C920 680 760 610 600 700 C470 770 380 720 270 760" fill="none" stroke="url(#waves)" stroke-width="46"/>
  <!-- park -->
  <path d="M640 180 L900 170 L920 360 L660 380 Z" fill="#1d3326" stroke="#2b4a37" stroke-width="3"/>
  <circle cx="760" cy="260" r="36" fill="#173246"/>
  <!-- avenues -->
  <g stroke="#48505f" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M320 420 L1600 300"/>
    <path d="M560 0 L620 1000"/>
    <path d="M1000 0 L1040 1000"/>
    <path d="M300 880 L1600 820"/>
  </g>
  <path d="M380 1000 L1500 0" stroke="#5a6272" stroke-width="16" fill="none"/>
  <!-- bridges -->
  <g stroke="#6a7384" stroke-width="10"><path d="M600 660 L612 740"/><path d="M1020 575 L1030 650"/><path d="M1340 548 L1348 620"/></g>
  <!-- piers -->
  <g fill="#3a4050"><rect x="200" y="270" width="110" height="18"/><rect x="190" y="330" width="120" height="18"/><rect x="200" y="390" width="100" height="18"/></g>
  <text x="1560" y="975" text-anchor="end" font-family="Georgia, serif" font-size="26" fill="#ffffff" fill-opacity="0.25" letter-spacing="4">PLACEHOLDER MAP</text>
</svg>
