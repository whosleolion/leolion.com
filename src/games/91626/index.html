<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Farm chore rhythm prototype — a game by Leo Lion, in progress." />
  <title>91626 — Farm Rhythm (prototype)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:  #080808;
      --white:  #f0ede6;
      --muted:  #a09e96;
      --accent: #ff3c00;
      --accent2: #ffd600;
      --font-display: 'Etna', 'Bebas Neue', sans-serif;
      --font-ui: 'Space Grotesk', 'Inter', sans-serif;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-ui);
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
    }
    canvas#game {
      display: block;
      width: 100vw; height: 100svh;
      touch-action: none;
    }

    .chrome {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .chrome a, .chrome span { pointer-events: auto; }

    .back-link {
      position: absolute; top: 1rem; left: 1rem;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }

    .build-tag {
      position: absolute; top: 1rem; right: 1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    .build-tag b { color: var(--accent); font-weight: 700; }

    .title-card {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    }
    .title-card__num {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 7rem);
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--white);
    }
    .title-card__sub {
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted);
    }
    .title-card__sub .hl { color: var(--accent2); }
    .title-card.hidden { display: none; }

    .hud {
      position: absolute; top: 3.25rem; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      display: none;
      flex-direction: column; align-items: center; gap: 0.15rem;
    }
    .hud.visible { display: flex; }
    .hud__score {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--white);
    }
    .hud__combo {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent2);
      min-height: 1em;
    }

    .debug-overlay {
      position: absolute; bottom: 1rem; left: 1rem;
      font-size: 0.65rem; letter-spacing: 0.05em;
      color: var(--muted);
      background: rgba(8,8,8,0.6);
      border: 1px solid rgba(240,237,230,0.12);
      border-radius: 3px;
      padding: 0.4rem 0.6rem;
      white-space: pre;
      display: none;
    }
    .debug-overlay.visible { display: block; }
  </style>
</head>
<body>

  <canvas id="game" aria-hidden="true"></canvas>

  <div class="chrome">
    <a class="back-link" href="/">&larr; leolion.com</a>
    <span class="build-tag">SESSION <b>91626</b> &middot; PROTOTYPE</span>

    <div class="title-card" id="titleCard">
      <div class="title-card__num">91626</div>
      <div class="title-card__sub">tap or press <span class="hl">space</span> to start chores</div>
    </div>

    <div class="hud" id="hud">
      <div class="hud__score" id="hudScore">SCORE 0</div>
      <div class="hud__combo" id="hudCombo"></div>
    </div>

    <pre class="debug-overlay" id="debugOverlay"></pre>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
